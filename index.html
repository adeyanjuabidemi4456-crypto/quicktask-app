<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Daily Bonus App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Welcome to TaskApp!</h1>
    <p id="greeting">Loading user profile...</p>

    <button id="bonusBtn" onclick="claimBonus()">Claim Daily Bonus</button>
    <div id="status"></div>

    <script>
        // Initialize Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Your custom Google Apps Script URL
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzBPsfVCnLBbDqE4AkTih1y8dy2Xesfanr9j8KkYS22eONWq4KX7uxQ-Fh8fImsUzXw/exec";

        let userTelegramId = "12345678"; // Fallback for browser testing
        let userTelegramName = "Test User";

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userTelegramId = tg.initDataUnsafe.user.id;
            userTelegramName = tg.initDataUnsafe.user.first_name;
            document.getElementById("greeting").innerText = `Hello, ${userTelegramName}!`;
        } else {
            document.getElementById("greeting").innerText = `Hello, ${userTelegramName} (Browser Mode)!`;
        }

        // Register user and log bonus on click
        function claimBonus() {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Processing bonus...";

            const payload = {
                id: userTelegramId,
                name: userTelegramName
            };

            // Send data to Google Sheets via Apps Script
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            }).then(() => {
                statusDiv.innerText = "🎉 Daily Bonus Claimed & Registered Successfully!";
                document.getElementById("bonusBtn").disabled = true;
                document.getElementById("bonusBtn").style.opacity = "0.6";
            }).catch((error) => {
                console.error("Error:", error);
                statusDiv.innerText = "❌ Failed to claim bonus. Try again.";
            });
        }
    </script>
</body>
    </html>
