<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Pay</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #07090e;
            color: #f8fafc;
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: #121824;
            border: 1px solid #1f293d;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .btn {
            background: #06b6d4;
            color: #07090e;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .balance {
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h3>Available Earnings</h3>
        <div class="balance" id="bal">₦0.00</div>
        <button class="btn" onclick="addMoney()">Claim +₦100 Reward</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let currentBalance = 0;

        function addMoney() {
            currentBalance += 100;
            document.getElementById('bal').innerText = '₦' + currentBalance.toFixed(2);
            alert('Success! ₦100 added.');
            if (tg.hapticFeedback) {
                tg.hapticFeedback.notificationOccurred('success');
            }
        }
    </script>

</body>
</html>
