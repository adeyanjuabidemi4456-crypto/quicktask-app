<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Pay</title>
    <style>
        :root {
            --bg-base: #07090e;
            --surface-color: #121824;
            --surface-border: #1f293d;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --neon-cyan: #06b6d4;
            --success-green: #10b981;
            --nav-bg: #0d121c;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
            padding-bottom: 80px;
        }

        .container {
            max-width: 420px;
            margin: 0 auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .header {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 12px 16px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .user-info h3 { margin: 0 0 2px 0; font-size: 15px; }
        .user-info p { margin: 0; font-size: 11px; color: var(--text-sub); }

        .badge {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-green);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .box {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 15px;
            text-align: center;
        }

        h1 { color: var(--neon-cyan); font-size: 36px; margin: 10px 0; }

        .btn {
            background: var(--neon-cyan);
            color: #07090e;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn:active { opacity: 0.8; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-card span { font-size: 10px; color: var(--text-sub); text-transform: uppercase; }
        .stat-card h4 { margin: 5px 0 0 0; font-size: 14px; }

        .task-card {
            background: var(--surface-color);
            border: 1px solid var(--surface-border);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .task-info h4 { margin: 0 0 4px 0; font-size: 14px; }
        .task-info p { margin: 0; font-size: 12px; color: var(--success-green); font-weight: bold; }

        .task-btn {
            background: var(--neon-cyan);
            color: #07090e;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--nav-bg);
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 11px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-btn.active { color: var(--neon-cyan); }
        .nav-btn span:first-child { font-size: 18px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <h3>Daniel</h3>
                <p>Quick Task Hub</p>
            </div>
            <div class="badge">Active</div>
        </div>

        <!-- HOME PAGE -->
        <div id="page-home" class="page active">
            <div class="box">
                <p style="margin: 0; color: var(--text-sub); font-size: 12px;">AVAILABLE EARNINGS</p>
                <h1 id="balance">₦0.00</h1>
                <button class="btn" onclick="claimBonus()">Claim Daily Bonus (+₦100)</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <span>Tasks Done</span>
                    <h4 id="tasks-count">0/3</h4>
                </div>
                <div class="stat-card">
                    <span>Streak</span>
                    <h4>Day 1</h4>
                </div>
                <div class="stat-card">
                    <span>Status</span>
                    <h4 style="color: var(--success-green);">Secure</h4>
                </div>
            </div>
        </div>

        <!-- EARN PAGE -->
        <div id="page-earn" class="page">
            <h3 style="font-size: 15px; margin-bottom: 12px;">Available Tasks</h3>
            
            <div class="task-card">
                <div class="task-info">
                    <h4>Join Telegram Channel</h4>
                    <p>+₦250</p>
                </div>
                <button class="task-btn" id="t1-btn" onclick="completeTask('t1-btn', 250)">Start</button>
            </div>

            <div class="task-card">
                <div class="task-info">
                    <h4>Invite a Friend</h4>
                    <p>+₦500</p>
                </div>
                <button class="task-btn" id="t2-btn" onclick="completeTask('t2-btn', 500)">Invite</button>
            </div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="page-profile" class="page">
            <h3 style="font-size: 15px; margin-bottom: 12px;">Account Overview</h3>
            <div class="box" style="text-align: left;">
                <p style="margin: 8px 0; color: var(--text-sub);">Name: <strong style="color:white;">Daniel</strong></p>
                <p style="margin: 8px 0; color: var(--text-sub);">Total Lifetime Earned: <strong id="lifetime" style="color: var(--neon-cyan);">₦0.00</strong></p>
                <p style="margin: 8px 0; color: var(--text-sub);">Platform Status: <strong style="color: var(--success-green);">Verified</strong></p>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home', this)">
            <span>🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-btn" onclick="switchTab('earn', this)">
            <span>💼</span>
            <span>Earn</span>
        </button>
        <button class="nav-btn" onclick="switchTab('profile', this)">
            <span>⚙️</span>
            <span>Profile</span>
        </button>
    </div>

    <script>
        let balance = 0;
        let lifetime = 0;
        let tasksDone = 0;

        function claimBonus() {
            balance += 100;
            lifetime += 100;
            tasksDone++;
            updateDisplay();
            alert('Success! +₦100 added.');
        }

        function completeTask(btnId, reward) {
            balance += reward;
            lifetime += reward;
            tasksDone++;
            updateDisplay();
            
            let btn = document.getElementById(btnId);
            btn.innerText = 'Done';
            btn.style.background = '#1e293b';
            btn.style.color = '#94a3b8';
            btn.disabled = true;
            
            alert(`Task completed! +₦${reward} added.`);
        }

        function updateDisplay() {
            document.getElementById('balance').innerText = '₦' + balance.toFixed(2);
            document.getElementById('lifetime').innerText = '₦' + lifetime.toFixed(2);
            document.getElementById('tasks-count').innerText = tasksDone + '/3';
        }

        function switchTab(pageId, btnElement) {
            // Hide all pages
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Show selected page
            document.getElementById('page-' + pageId).classList.add('active');

            // Update nav buttons style
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }
    </script>

</body>
    </html>
