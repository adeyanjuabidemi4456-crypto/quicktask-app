<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Task Pay</title>
    <style>
        body {
            background-color: #07090e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .box {
            background: #121824;
            border: 2px solid #06b6d4;
            padding: 20px;
            border-radius: 15px;
            margin: 20px auto;
            max-width: 400px;
        }
        h1 { color: #06b6d4; font-size: 32px; margin: 10px 0; }
        .btn {
            background: #06b6d4;
            color: #07090e;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }
        .btn:active { background: #0891b2; }
    </style>
</head>
<body>

    <h2>Quick Task Hub</h2>
    <p>Welcome, Daniel!</p>

    <div class="box">
        <p style="margin: 0; color: #94a3b8;">AVAILABLE BALANCE</p>
        <h1 id="balance">₦0.00</h1>
        <button class="btn" onclick="earnMoney()">Claim +₦100 Reward</button>
    </div>

    <script>
        let cash = 0;
        function earnMoney() {
            cash += 100;
            document.getElementById('balance').innerText = '₦' + cash.toFixed(2);
            alert('Success! ₦100 added to your balance.');
        }
    </script>

</body>
</html>
